<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <rect width="960" height="680" fill="#ffffff"/>
  <defs>
    <!-- Flecha abierta: asociación y dependencia -->
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1c2333" stroke-width="1.5"/>
    </marker>
    <!-- Triángulo hueco: herencia -->
    <marker id="herencia" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffffff" stroke="#1c2333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- ===== OfertaControlador ===== -->
  <g transform="translate(20,20)">
    <rect width="300" height="284" fill="#eef3ff" stroke="#1c2333" stroke-width="1.5"/>
    <text x="150" y="20" text-anchor="middle" font-weight="bold">OfertaControlador</text>
    <line x1="0" y1="30" x2="300" y2="30" stroke="#1c2333"/>
    <text x="8" y="48">- modelo: Oferta</text>
    <line x1="0" y1="58" x2="300" y2="58" stroke="#1c2333"/>
    <text x="8" y="76">+ buscar(): void</text>
    <text x="8" y="94">+ admin(): void</text>
    <text x="8" y="112">+ entrar(): void</text>
    <text x="8" y="130">+ salir(): void</text>
    <text x="8" y="148">+ guardar(): void</text>
    <text x="8" y="166">+ eliminar(): void</text>
    <text x="8" y="184">+ actualizar(): void</text>
    <text x="8" y="202">- validar(oferta): ?string</text>
    <text x="8" y="220">- exigirAdmin(): void</text>
    <text x="8" y="238">- exigirPost(): void</text>
    <text x="8" y="256">- mostrar(vista, datos): void</text>
    <text x="8" y="274">- irA(accion): never</text>
  </g>

  <!-- ===== Oferta (modelo) ===== -->
  <g transform="translate(600,20)">
    <rect width="340" height="230" fill="#eef3ff" stroke="#1c2333" stroke-width="1.5"/>
    <text x="170" y="20" text-anchor="middle" font-weight="bold">Oferta</text>
    <line x1="0" y1="30" x2="340" y2="30" stroke="#1c2333"/>
    <text x="8" y="48">- pdo: PDO</text>
    <line x1="0" y1="58" x2="340" y2="58" stroke="#1c2333"/>
    <text x="8" y="76">+ buscar(filtros): array</text>
    <text x="8" y="94">+ buscarPorId(id): ?array</text>
    <text x="8" y="112">+ guardar(oferta, fuenteId): void</text>
    <text x="8" y="130">+ actualizar(id, oferta): void</text>
    <text x="8" y="148">+ eliminar(id): void</text>
    <text x="8" y="166">+ borrarNoVistas(fuenteId, desde): int</text>
    <text x="8" y="184">+ fuentes(): array</text>
    <text x="8" y="202">+ horaActual(): string</text>
    <text x="8" y="220">- valores(oferta): array</text>
  </g>

  <!-- Controlador -> Oferta: asociación -->
  <line x1="320" y1="70" x2="600" y2="70" stroke="#1c2333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="460" y="62" text-anchor="middle">usa</text>
  <text x="590" y="88" text-anchor="end">1</text>

  <!-- ===== Fuente (abstracta) ===== -->
  <g transform="translate(330,340)">
    <rect width="320" height="132" fill="#fff7e8" stroke="#1c2333" stroke-width="1.5"/>
    <text x="160" y="16" text-anchor="middle" font-style="italic">«abstract»</text>
    <text x="160" y="32" text-anchor="middle" font-weight="bold" font-style="italic">Fuente</text>
    <line x1="0" y1="40" x2="320" y2="40" stroke="#1c2333"/>
    <line x1="0" y1="50" x2="320" y2="50" stroke="#1c2333"/>
    <text x="8" y="68" font-style="italic">+ obtenerOfertas(): array</text>
    <text x="8" y="86"># descargar(url, datosPost): string</text>
    <text x="8" y="104"># detectarDepartamento(texto): string</text>
    <text x="8" y="122">- sinTildes(texto): string</text>
  </g>

  <!-- Controlador ..> Fuente: dependencia (crea las fuentes según la tabla "fuentes") -->
  <path d="M170,304 L170,406 L330,406" fill="none" stroke="#1c2333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flecha)"/>
  <text x="178" y="360">«crea» según</text>
  <text x="178" y="376">tabla fuentes</text>

  <!-- ===== Fuentes concretas ===== -->
  <g transform="translate(20,560)">
    <rect width="280" height="86" fill="#fff7e8" stroke="#1c2333" stroke-width="1.5"/>
    <text x="140" y="20" text-anchor="middle" font-weight="bold">UruguayConcursa</text>
    <line x1="0" y1="30" x2="280" y2="30" stroke="#1c2333"/>
    <text x="8" y="48">+ POR_PAGINA = 100</text>
    <line x1="0" y1="58" x2="280" y2="58" stroke="#1c2333"/>
    <text x="8" y="76">+ obtenerOfertas(): array</text>
  </g>
  <g transform="translate(340,560)">
    <rect width="280" height="86" fill="#fff7e8" stroke="#1c2333" stroke-width="1.5"/>
    <text x="140" y="20" text-anchor="middle" font-weight="bold">BuscoJobs</text>
    <line x1="0" y1="30" x2="280" y2="30" stroke="#1c2333"/>
    <text x="8" y="48">+ PAGINAS = 10</text>
    <line x1="0" y1="58" x2="280" y2="58" stroke="#1c2333"/>
    <text x="8" y="76">+ obtenerOfertas(): array</text>
  </g>
  <g transform="translate(660,560)">
    <rect width="280" height="86" fill="#fff7e8" stroke="#1c2333" stroke-width="1.5"/>
    <text x="140" y="20" text-anchor="middle" font-weight="bold">Utu</text>
    <line x1="0" y1="30" x2="280" y2="30" stroke="#1c2333"/>
    <line x1="0" y1="58" x2="280" y2="58" stroke="#1c2333"/>
    <text x="8" y="76">+ obtenerOfertas(): array</text>
  </g>

  <!-- Herencia: cada fuente concreta extiende Fuente -->
  <path d="M160,560 L160,520 L490,520 L490,472" fill="none" stroke="#1c2333" stroke-width="1.5" marker-end="url(#herencia)"/>
  <path d="M480,560 L480,520" fill="none" stroke="#1c2333" stroke-width="1.5"/>
  <path d="M800,560 L800,520 L490,520" fill="none" stroke="#1c2333" stroke-width="1.5"/>

  <text x="20" y="670" font-size="12" fill="#667085">Las vistas (vistas/*.php) no son clases: el controlador las carga con mostrar().</text>
</svg>
