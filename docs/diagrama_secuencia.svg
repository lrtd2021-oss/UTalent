<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="llena" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1c2333"/>
    </marker>
    <marker id="abierta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1c2333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Participantes -->
  <g font-weight="bold" text-anchor="middle">
    <rect x="20" y="20" width="120" height="40" fill="#f6f8fd" stroke="#1c2333"/><text x="80" y="45">Administrador</text>
    <rect x="170" y="20" width="160" height="40" fill="#eef3ff" stroke="#1c2333"/><text x="250" y="45">OfertaControlador</text>
    <rect x="370" y="20" width="120" height="40" fill="#eef3ff" stroke="#1c2333"/><text x="430" y="45">Oferta</text>
    <rect x="530" y="20" width="170" height="40" fill="#fff7e8" stroke="#1c2333"/><text x="615" y="45">:Fuente (ej. BuscoJobs)</text>
    <rect x="740" y="20" width="200" height="40" fill="#fff7e8" stroke="#1c2333"/><text x="840" y="45">Portal externo (HTTP)</text>
  </g>
  <!-- Líneas de vida -->
  <g stroke="#9aa3b5" stroke-dasharray="5 4">
    <line x1="80" y1="60" x2="80" y2="620"/><line x1="250" y1="60" x2="250" y2="620"/>
    <line x1="430" y1="60" x2="430" y2="620"/><line x1="615" y1="60" x2="615" y2="620"/>
    <line x1="840" y1="60" x2="840" y2="620"/>
  </g>

  <g stroke="#1c2333" stroke-width="1.4" fill="none">
    <line x1="80" y1="95" x2="250" y2="95" marker-end="url(#llena)"/>
    <line x1="250" y1="135" x2="430" y2="135" marker-end="url(#llena)"/>
    <line x1="430" y1="160" x2="250" y2="160" stroke-dasharray="5 4" marker-end="url(#abierta)"/>
    <line x1="250" y1="235" x2="615" y2="235" marker-end="url(#llena)"/>
    <line x1="615" y1="265" x2="840" y2="265" marker-end="url(#llena)"/>
    <line x1="840" y1="290" x2="615" y2="290" stroke-dasharray="5 4" marker-end="url(#abierta)"/>
    <line x1="615" y1="315" x2="615" y2="330"/><path d="M615,315 h28 v18 h-26" marker-end="url(#llena)"/>
    <line x1="615" y1="360" x2="250" y2="360" stroke-dasharray="5 4" marker-end="url(#abierta)"/>
    <line x1="250" y1="410" x2="430" y2="410" marker-end="url(#llena)"/>
    <line x1="250" y1="470" x2="430" y2="470" marker-end="url(#llena)"/>
    <line x1="250" y1="580" x2="80" y2="580" stroke-dasharray="5 4" marker-end="url(#abierta)"/>
  </g>

  <text x="165" y="88" text-anchor="middle">POST ?accion=actualizar (token)</text>
  <text x="340" y="128" text-anchor="middle">fuentes()</text>
  <text x="340" y="176" text-anchor="middle" fill="#444">lista de fuentes</text>
  <text x="430" y="228" text-anchor="middle">new $fuente['clase']() → obtenerOfertas()</text>
  <text x="727" y="258" text-anchor="middle">descargar(url)</text>
  <text x="727" y="306" text-anchor="middle" fill="#444">JSON / HTML</text>
  <text x="652" y="328">normaliza al formato común</text>
  <text x="430" y="376" text-anchor="middle" fill="#444">array de ofertas</text>
  <text x="340" y="403" text-anchor="middle">guardar(oferta, fuenteId)</text>
  <text x="340" y="463" text-anchor="middle">borrarNoVistas(fuenteId, inicio)</text>
  <text x="165" y="573" text-anchor="middle" fill="#444">redirige al panel con el resumen</text>

  <!-- Marco loop: por cada fuente -->
  <rect x="160" y="195" width="770" height="300" fill="none" stroke="#1c2333" stroke-width="1.2"/>
  <path d="M160,195 h120 v18 l-10,10 h-110 z" fill="#f1f3f8" stroke="#1c2333" stroke-width="1.2"/>
  <text x="168" y="214" font-weight="bold" font-size="12">loop  [por cada fuente]</text>
  <!-- Marco loop interno: por cada oferta -->
  <rect x="200" y="388" width="300" height="38" fill="none" stroke="#1c2333" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="206" y="422" font-size="11" fill="#444">loop [por cada oferta]</text>
  <!-- Nota de error -->
  <rect x="520" y="440" width="400" height="44" fill="#fff3f3" stroke="#c62828"/>
  <text x="530" y="458" font-size="12">Si la fuente falla (try/catch): se registra el error,</text>
  <text x="530" y="475" font-size="12">se agrega al resumen y se sigue con la siguiente fuente.</text>
</svg>
