<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI', Arial, sans-serif" font-size="14">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1c2333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Límite del sistema -->
  <rect x="190" y="20" width="560" height="520" rx="8" fill="#f6f8fd" stroke="#1c2333" stroke-width="1.5"/>
  <text x="470" y="46" text-anchor="middle" font-weight="bold">Sistema UTalent</text>

  <!-- Actor: Usuario -->
  <g transform="translate(80,150)" stroke="#1c2333" stroke-width="1.8" fill="none">
    <circle cx="0" cy="0" r="14"/><line x1="0" y1="14" x2="0" y2="52"/><line x1="-22" y1="28" x2="22" y2="28"/>
    <line x1="0" y1="52" x2="-18" y2="82"/><line x1="0" y1="52" x2="18" y2="82"/>
  </g>
  <text x="80" y="256" text-anchor="middle" font-weight="bold">Usuario</text>
  <text x="80" y="274" text-anchor="middle" font-size="12" fill="#667085">(estudiante o egresado)</text>

  <!-- Actor: Administrador -->
  <g transform="translate(870,300)" stroke="#1c2333" stroke-width="1.8" fill="none">
    <circle cx="0" cy="0" r="14"/><line x1="0" y1="14" x2="0" y2="52"/><line x1="-22" y1="28" x2="22" y2="28"/>
    <line x1="0" y1="52" x2="-18" y2="82"/><line x1="0" y1="52" x2="18" y2="82"/>
  </g>
  <text x="870" y="406" text-anchor="middle" font-weight="bold">Administrador</text>

  <!-- Actor externo: Portales -->
  <rect x="20" y="440" width="140" height="60" rx="4" fill="#fff7e8" stroke="#1c2333" stroke-width="1.5"/>
  <text x="90" y="462" text-anchor="middle" font-size="12">«sistema externo»</text>
  <text x="90" y="482" text-anchor="middle" font-weight="bold">Portales de empleo</text>

  <!-- Casos de uso -->
  <g fill="#eef3ff" stroke="#1c2333" stroke-width="1.5">
    <ellipse cx="370" cy="100" rx="125" ry="30"/>
    <ellipse cx="600" cy="170" rx="120" ry="30"/>
    <ellipse cx="370" cy="200" rx="125" ry="30"/>
    <ellipse cx="600" cy="290" rx="120" ry="30"/>
    <ellipse cx="420" cy="380" rx="135" ry="30"/>
    <ellipse cx="600" cy="470" rx="125" ry="30"/>
    <ellipse cx="330" cy="480" rx="110" ry="30"/>
  </g>
  <text x="370" y="105" text-anchor="middle">CU-01 Buscar ofertas</text>
  <text x="600" y="175" text-anchor="middle">CU-02 Filtrar ofertas</text>
  <text x="370" y="205" text-anchor="middle">CU-03 Ver oferta original</text>
  <text x="600" y="295" text-anchor="middle">CU-04 Iniciar sesión</text>
  <text x="420" y="385" text-anchor="middle">CU-05 Actualizar ofertas</text>
  <text x="600" y="475" text-anchor="middle">CU-06 Gestionar ofertas (ABM)</text>
  <text x="330" y="485" text-anchor="middle">CU-07 Cerrar sesión</text>

  <!-- Asociaciones del Usuario -->
  <g stroke="#1c2333" stroke-width="1.4">
    <line x1="104" y1="170" x2="247" y2="108"/>
    <line x1="104" y1="185" x2="247" y2="196"/>
  </g>
  <!-- Asociaciones del Administrador -->
  <g stroke="#1c2333" stroke-width="1.4">
    <line x1="846" y1="315" x2="720" y2="295"/>
    <line x1="846" y1="335" x2="553" y2="380"/>
    <line x1="846" y1="350" x2="722" y2="462"/>
    <path d="M858,382 C820,540 520,545 440,488" fill="none"/>
  </g>
  <!-- Portales participan en Actualizar -->
  <line x1="160" y1="455" x2="300" y2="395" stroke="#1c2333" stroke-width="1.4"/>

  <!-- extend / include -->
  <g stroke="#1c2333" stroke-width="1.4" stroke-dasharray="6 4" fill="none">
    <line x1="490" y1="160" x2="470" y2="122" marker-end="url(#flecha)"/>
    <line x1="510" y1="355" x2="565" y2="318" marker-end="url(#flecha)"/>
    <line x1="610" y1="440" x2="605" y2="320" marker-end="url(#flecha)"/>
  </g>
  <text x="488" y="132" font-size="12" fill="#444">«extend»</text>
  <text x="470" y="330" font-size="12" fill="#444">«include»</text>
  <text x="614" y="392" font-size="12" fill="#444">«include»</text>
</svg>
